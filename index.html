<title>결함 야장</title>
<style>
/* Layout: one-screen field tool. Drawing on the left (paper stays white), input panel on the right, toolbar on top. */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f4f6f8;
  --ink: #16202b;
  --muted: #5a6573;
  --line: #cfd6de;
  --accent: #1d5bd8;
  --accent-ink: #ffffff;
  --mark: #d6332a;
  --ok: #1f8a4c;
  --warn: #b26a00;
  --paper-bg: #c9d0d8;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --tap: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151b; --surface: #19212a; --surface-2: #212a35; --ink: #e5eaf0; --muted: #96a2af;
    --line: #2e3945; --accent: #6e9cff; --accent-ink: #0d1520; --mark: #ff6b5e; --ok: #4cc283;
    --warn: #f0a640; --paper-bg: #0b0f14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #19212a; --surface-2: #212a35; --ink: #e5eaf0; --muted: #96a2af;
  --line: #2e3945; --accent: #6e9cff; --accent-ink: #0d1520; --mark: #ff6b5e; --ok: #4cc283;
  --warn: #f0a640; --paper-bg: #0b0f14; color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
#app { height: 100%; }

/* ---------- buttons ---------- */
.btn { min-height: var(--tap); padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--mark); border-color: color-mix(in srgb, var(--mark) 45%, var(--line)); }
.btn.danger.armed { background: var(--mark); color: #fff; border-color: var(--mark); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* ---------- home ---------- */
#home { height: 100%; overflow-y: auto; }
.home-inner { max-width: 880px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.intro h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.2; margin: 0 0 10px; text-wrap: balance; }
.intro p { margin: 0 0 18px; color: var(--muted); max-width: 60ch; line-height: 1.6; }
.intro .actions { display: flex; flex-wrap: wrap; gap: 10px; }
.sec-title { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
.plist { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-align: left; width: 100%; min-width: 0; }
.prow b { font-size: 16px; overflow-wrap: anywhere; }
.prow .meta { color: var(--muted); font-size: 13px; grid-column: 1; }
.prow .go { grid-row: 1 / span 2; grid-column: 2; color: var(--accent); font-weight: 500; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); margin-left: 6px; vertical-align: 2px; letter-spacing: .03em; }
.empty { padding: 22px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); line-height: 1.6; }
.checklist { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; line-height: 1.7; }
.checklist ol { margin: 6px 0 0; padding-left: 20px; }
.checklist b { color: var(--ink); }

/* ---------- work ---------- */
#work { height: 100%; display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .sep { width: 1px; height: 28px; background: var(--line); }
.bar .grow { flex: 1; }
.pname { font-weight: 700; max-width: 12ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager { display: inline-flex; align-items: center; gap: 4px; }
.pager .pg { min-width: 0; max-width: 20ch; overflow: hidden; text-overflow: ellipsis; }
.floor-btn { font-weight: 700; border-color: var(--ink); }
.floor-btn.unset { color: var(--warn); border-color: var(--warn); }
.tools { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.tools button { min-height: var(--tap); padding: 0 12px; border: 0; background: var(--surface); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.tools button + button { border-left: 1px solid var(--line); }
.tools button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tools svg { width: 18px; height: 18px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.ok i { background: var(--ok); }
.sync.busy i { background: var(--accent); }
.sync.warn { color: var(--warn); }
.sync.warn i { background: var(--warn); }
.sync.bad { color: #fff; background: var(--mark); }
.sync.bad i { background: #fff; }

.main { flex: 1; min-height: 0; display: flex; }
#vp { position: relative; flex: 1 1 64%; min-width: 0; overflow: hidden; background: var(--paper-bg); touch-action: none; user-select: none; -webkit-user-select: none; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: 0 2px 14px rgba(0,0,0,.18); background: #fff; }
#cv, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#vp .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
#hint { position: absolute; left: 12px; bottom: 12px; background: rgba(22,32,43,.82); color: #fff; font-size: 13px; padding: 6px 10px; border-radius: 6px; pointer-events: none; }

#panel { flex: 0 0 min(390px, 36%); min-width: 300px; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding-block: 14px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.ph .t { display: grid; gap: 2px; }
.ph .eyebrow { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.ph .big { font-size: 22px; font-weight: 700; }
.ph .big .num { color: var(--mark); }
.fld { display: grid; gap: 6px; }
.fld > .lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .05em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.add { border-style: dashed; color: var(--muted); }
.inp { min-height: var(--tap); width: 100%; min-width: 0; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
textarea.inp { padding: 8px 10px; min-height: 64px; resize: vertical; line-height: 1.5; }
.row2 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
.row2 .x { padding-bottom: 12px; color: var(--muted); }
.row-photo { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: end; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { width: 40px; min-height: var(--tap); border: 0; background: var(--surface-2); font-size: 18px; }
.stepper input { width: 44px; text-align: center; border: 0; background: var(--surface); min-height: var(--tap); }
.photo-wrap { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.sugg { font-size: 12px; padding: 0 10px; }
.pfoot { display: flex; gap: 8px; margin-top: 4px; }
.pfoot .btn { flex: 1; }
.list { display: grid; gap: 4px; }
.lrow { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; min-width: 0; }
.lrow .n { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--mark); color: var(--mark); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.lrow .d { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.lrow .d small { display: block; color: var(--muted); font-size: 12px; }
.lrow .miss { color: var(--warn); }
.help { color: var(--muted); font-size: 13px; line-height: 1.6; }
.help b { color: var(--ink); }
.stat { display: flex; gap: 16px; flex-wrap: wrap; }
.stat div { display: grid; }
.stat .v { font-size: 22px; font-weight: 700; }
.stat .k { font-size: 12px; color: var(--muted); }

@media (max-width: 760px) {
  .main { flex-direction: column; }
  #panel { flex: 0 0 auto; max-height: 46%; min-width: 0; border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .tools button span { display: none; }
}

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,15,20,.45); display: grid; place-items: center; padding: 16px; }
.sheet { width: min(560px, 100%); max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 14px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.sheet h3 { margin: 0; font-size: 19px; }
.sheet .sub { margin: -8px 0 0; color: var(--muted); font-size: 13px; }
.grid-floors { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
.grid-floors .chip { border-radius: 8px; }
.menu { display: grid; gap: 8px; }
.menu .btn { justify-content: flex-start; min-height: 52px; text-align: left; }
.menu .btn small { color: var(--muted); font-weight: 400; margin-left: auto; padding-left: 10px; }
.menu-h { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin-top: 6px; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.pagelist { display: grid; gap: 4px; }
.pagelist .btn { justify-content: space-between; }
.pagelist .btn[aria-current="true"] { border-color: var(--accent); color: var(--accent); }
.filepick { border: 1px dashed var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
.filepick input { color: var(--ink); max-width: 100%; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
@media (prefers-reduced-motion: no-preference) { #toast { transition: opacity .2s; } }
</style>

<div id="app">
  <section id="home"></section>
  <section id="work" hidden>
    <header class="bar" id="bar"></header>
    <div class="main">
      <div id="vp">
        <div id="stage"><canvas id="cv"></canvas><svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div class="loading" id="loading" hidden>도면 여는 중…</div>
        <div id="hint" hidden></div>
      </div>
      <aside id="panel"></aside>
    </div>
  </section>
  <div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" hidden></div>

<script>window.DY_OFFLINE = true; window.DY_WORKER_SRC = "vendor/pdf.worker.min.js";</script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script>
"use strict";
/* =========================================================
   결함 야장 — 태블릿 현장 결함 표시 도구
   저장: 기기(IndexedDB) + 클라우드(db/assets, 가능할 때) + 백업 파일
   ========================================================= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const now = () => Date.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clone = (o) => JSON.parse(JSON.stringify(o));

const OFFLINE_APP = !!window.DY_OFFLINE; // 홈 화면 앱(GitHub Pages) 빌드에서만 true
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = window.DY_WORKER_SRC || "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const DEFAULT_MEMBERS = ["벽체", "기둥", "보", "슬래브", "계단", "옹벽", "외벽", "지붕", "기타"];
const DEFAULT_TYPES = ["균열", "망상균열", "누수", "백태", "박리", "박락", "철근노출", "재료분리", "도장박리", "들뜸", "파손", "기타"];
const FLOORS = ["지하3층", "지하2층", "지하1층", "1층", "2층", "3층", "4층", "5층", "6층", "7층", "8층", "9층", "10층", "11층", "12층", "옥탑층", "지붕층"];
const KIND_LABEL = { point: "점", arrow: "화살표", area: "영역" };

/* ---------------- 기기 저장 (IndexedDB, 실패 시 메모리) ---------------- */
const Local = (() => {
  let dbp = null;
  const mem = { projects: new Map(), blobs: new Map() };
  let available = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open("defect-yajang", 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("projects", { keyPath: "id" }); d.createObjectStore("blobs"); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
      } catch (e) { res(null); }
    }).then((d) => { available = !!d; return d; });
    return dbp;
  }
  function run(store, mode, fn) {
    return open().then((d) => new Promise((res) => {
      if (!d) return res(undefined);
      try {
        const t = d.transaction(store, mode);
        const req = fn(t.objectStore(store));
        t.oncomplete = () => res(req ? req.result : undefined);
        t.onerror = () => { available = false; res(undefined); };
        t.onabort = () => { available = false; res(undefined); };
      } catch (e) { available = false; res(undefined); }
    }));
  }
  return {
    get available() { return available; },
    open,
    async putProject(p) { mem.projects.set(p.id, p); await run("projects", "readwrite", (s) => s.put(clone(p))); },
    async getProjects() {
      const r = (await run("projects", "readonly", (s) => s.getAll())) || [];
      const m = new Map(); r.forEach((p) => m.set(p.id, p)); mem.projects.forEach((p, k) => m.set(k, p));
      return [...m.values()];
    },
    async getProject(id) { if (mem.projects.has(id)) return mem.projects.get(id); return (await run("projects", "readonly", (s) => s.get(id))) || null; },
    async delProject(id) { mem.projects.delete(id); await run("projects", "readwrite", (s) => s.delete(id)); },
    async putBlob(k, b) { mem.blobs.set(k, b); await run("blobs", "readwrite", (s) => s.put(b, k)); },
    async getBlob(k) {
      if (mem.blobs.has(k)) return mem.blobs.get(k);
      const r = await run("blobs", "readonly", (s) => s.get(k));
      if (r instanceof Blob) { mem.blobs.set(k, r); return r; }
      return null;
    },
    async delBlob(k) { mem.blobs.delete(k); await run("blobs", "readwrite", (s) => s.delete(k)); },
  };
})();

/* ---------------- 클라우드 / 파일 저장 ---------------- */
const Cloud = { db: null, assets: null, dl: null, ready: false };
async function initCaps() {
  if (!window.claude || typeof window.claude.use !== "function") { Cloud.ready = true; updateSync(); return; }
  const safe = (n) => window.claude.use(n).catch(() => null);
  const [db, as, dl] = await Promise.all([safe("db"), safe("assets"), safe("downloads")]);
  Cloud.db = db; Cloud.assets = as; Cloud.dl = dl; Cloud.ready = true;
  updateSync();
  if (S.view === "home") renderHome();
  else if (S.proj && Cloud.db) { pullCloud(S.proj.id, true); scheduleCloud(500); }
}

async function saveFile(filename, data) {
  if (Cloud.dl) {
    try { await Cloud.dl.save({ filename, data }); toast("저장했습니다: " + filename); }
    catch (e) {
      const c = e && e.code;
      if (c === "declined") toast("저장을 취소했습니다");
      else if (c === "rate_limited") toast("저장 창이 이미 열려 있습니다. 잠시 후 다시 눌러주세요");
      else toast("파일 저장 실패: " + ((e && e.message) || c || e));
    }
    return;
  }
  if (window.claude && !Cloud.ready) { toast("준비 중입니다. 잠시 후 다시 눌러주세요"); return; }
  const blob = data instanceof Blob ? data : new Blob([data]);
  // 아이패드: 공유 시트로 저장 ("파일에 저장" 또는 카톡 전송)
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isIOS && navigator.canShare) {
    try {
      const file = new File([blob], filename, { type: blob.type || "application/octet-stream" });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); toast("저장했습니다: " + filename); return; }
    } catch (e) { if (e && e.name === "AbortError") { toast("저장을 취소했습니다"); return; } }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------------- 상태 ---------------- */
const S = {
  view: "home",
  proj: null,        // {id,name,createdAt,updatedAt,files,floors,marks,prefs}
  pages: [],         // [{fid,i,key,name}]
  cur: 0,
  pi: null,          // current page info {W,H,kind,page|img}
  tool: "point",
  sel: null,
  base: 1, z: 1, tx: 0, ty: 0,
  lastInput: { member: "벽체", dtype: "균열" },
  undo: [],
  sync: { state: "idle", at: 0, msg: "" },
  cloudList: null,
};

/* ---------------- 공용 ---------------- */
let toastTimer = null;
function toast(msg, ms = 2600) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false; t.style.opacity = "1";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = "0"; setTimeout(() => (t.hidden = true), 220); }, ms);
}
function fmtDate(t) { if (!t) return ""; const d = new Date(t); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtTime(t) { const d = new Date(t); const p = (n) => String(n).padStart(2, "0"); return `${p(d.getHours())}:${p(d.getMinutes())}`; }
function today() { const d = new Date(); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function floorKey(f) {

  if (/옥탑|PH/i.test(s)) return 900;
  if (/지붕|옥상|R/i.test(s)) return 950;
  m = s.match(/(\d+)/); if (m) return Number(m[1]);

}
function members() { return (S.proj && S.proj.prefs && S.proj.prefs.members) || DEFAULT_MEMBERS; }
function dtypes() { return (S.proj && S.proj.prefs && S.proj.prefs.types) || DEFAULT_TYPES; }
function sizeFactor() { return (S.proj && S.proj.prefs && S.proj.prefs.size) || 1; }
function live() { return S.proj ? S.proj.marks.filter((m) => !m.deleted) : []; }
function curKey() { return S.pages[S.cur] ? S.pages[S.cur].key : null; }
function floorOfPage(k) { return (S.proj && S.proj.floors[k]) || ""; }
function floorOf(m) { return floorOfPage(m.pageKey); }
function marksOn(k) { return live().filter((m) => m.pageKey === k).sort((a, b) => (a.no || 0) - (b.no || 0)); }
function nextNo(floor, exceptPage) {

function nextPhoto(base) {

async function uploadMissingAssets(p) {
  if (!Cloud.assets) return false;
  let changed = false;
  for (const f of p.files) {
    if (f.assetId || f.tooBig) continue;
    const blob = await Local.getBlob(f.fid);
    if (!blob) continue;
    if (blob.size > 20 * 1024 * 1024) { f.tooBig = true; continue; }
    const type = f.type === "pdf" ? "application/pdf" : (f.mime || "image/jpeg");
    try { const r = await Cloud.assets.upload(blob, { type }); f.assetId = r.id; changed = true; }
    catch (e) { if (e && (e.code === "too_large" || e.code === "unsupported_type")) f.tooBig = true; else throw e; }
  }
  return changed;
}

async function pushCloud() {
  const p = S.proj;
  if (!p || !Cloud.db) { updateSync(); return; }
  if (cloudBusy) { scheduleCloud(1500); return; }
  if (navigator.onLine === false) { S.sync.state = "offline"; updateSync(); return; }
  cloudBusy = true; S.sync.state = "busy"; updateSync();
  const pages = [...dirtyPages]; dirtyPages.clear();
  let gotRemote = false;
  try {
    await uploadMissingAssets(p);
    for (const pk of pages) {
      const ref = Cloud.db.doc(`projects/${p.id}/marks/${pk}`);
      let remote = [];
      const snap = await ref.get();
      if (snap.exists) remote = (snap.data().marks) || [];
      const local = p.marks.filter((m) => m.pageKey === pk);
      const merged = mergeMarks(remote, local);
      if (merged.length !== local.length || merged.some((m) => !local.includes(m))) gotRemote = true;
      await ref.set({ marks: merged, updatedAt: now() });
      p.marks = p.marks.filter((m) => m.pageKey !== pk).concat(merged);
    }
    await Cloud.db.doc(`projects/${p.id}`).set(metaOf(p));
    S.sync.state = "ok"; S.sync.at = now(); S.sync.msg = "";
    flushLocal();
    if (gotRemote && S.proj === p) { renderOverlay(); renderPanel(); }
  } catch (e) {
    pages.forEach((k) => dirtyPages.add(k));
    S.sync.state = navigator.onLine === false ? "offline" : "error";
    S.sync.msg = (e && (e.code || e.message)) || String(e);
    if (e && e.code === "quota_exceeded") toast("클라우드 저장 공간이 찼습니다. 백업 파일로 저장해주세요", 4000);
    scheduleCloud(30000);
  }
  cloudBusy = false; updateSync();
}

async function cloudProjects() {
  if (!Cloud.db) return [];

  catch (e) { return []; }
}

// 클라우드 내용을 받아서 기기 내용과 합침
async function pullCloud(id, quiet) {
  if (!Cloud.db) return null;
  try {
    const metaSnap = await Cloud.db.doc(`projects/${id}`).get();
    if (!metaSnap.exists) return null;
    const meta = metaSnap.data();
    const ms = await Cloud.db.collection(`projects/${id}/marks`).get();
    let remoteMarks = [];
    ms.docs.forEach((d) => { const v = d.data(); if (v && Array.isArray(v.marks)) remoteMarks = remoteMarks.concat(v.marks); });
    let p = (S.proj && S.proj.id === id) ? S.proj : await Local.getProject(id);
    if (!p) p = { id, name: meta.name, createdAt: meta.createdAt, updatedAt: meta.updatedAt, files: [], floors: {}, marks: [], prefs: meta.prefs || {} };
    // 파일 목록 합치기
    for (const rf of meta.files || []) {
      let lf = p.files.find((f) => f.fid === rf.fid);
      if (!lf) { lf = { ...rf }; p.files.push(lf); }
      else if (!lf.assetId && rf.assetId) lf.assetId = rf.assetId;
      if (!(await Local.getBlob(lf.fid)) && lf.assetId) {
        try { const r = await fetch("/_blob/" + lf.assetId); if (r.ok) await Local.putBlob(lf.fid, await r.blob()); } catch (e) { /* 도면 못 받음 */ }
      }
    }
    const localNewer = (p.updatedAt || 0) >= (meta.updatedAt || 0);
    p.floors = localNewer ? { ...(meta.floors || {}), ...(p.floors || {}) } : { ...(p.floors || {}), ...(meta.floors || {}) };
    if (!localNewer && meta.prefs) p.prefs = meta.prefs;
    const before = p.marks.length;
    p.marks = mergeMarks(remoteMarks, p.marks);
    await Local.putProject(p);
    if (S.proj && S.proj.id === id) {
      S.proj = p; buildPages(); renderBar(); renderOverlay(); renderPanel();
      if (!quiet && p.marks.length !== before) toast("다른 기기에서 작업한 내용을 합쳤습니다");
    }
    return p;
  } catch (e) { if (!quiet) toast("클라우드에서 불러오지 못했습니다"); return null; }
}

function updateSync() {
  const el = $("#sync"); if (!el) return;
  let cls = "", txt = "";
  const localBad = Local.available === false;
  if (Cloud.db) {
    const st = S.sync.state;
    if (st === "busy") { cls = "busy"; txt = "백업 중"; }
    else if (st === "ok" && dirtyPages.size === 0) { cls = "ok"; txt = "백업됨 " + fmtTime(S.sync.at); }
    else if (st === "offline") { cls = "warn"; txt = localBad ? "오프라인 · 백업 파일 필요" : "오프라인 · 기기에 저장"; }
    else if (st === "error") { cls = "warn"; txt = "백업 재시도 대기"; }
    else { cls = localBad ? "warn" : ""; txt = localBad ? "기기 저장 불가" : "기기에 저장됨"; }
  } else {
    if (localBad) { cls = "bad"; txt = "저장 안 됨 · 백업 파일 저장"; }
    else { cls = ""; txt = "기기에 저장됨"; }
  }
  if (localBad && !Cloud.db) cls = "bad";

}

const docCache = new Map();
function loadImg(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
async function getDoc(fid) {
  if (docCache.has(fid)) return docCache.get(fid);
  const f = S.proj.files.find((x) => x.fid === fid);
  const blob = await Local.getBlob(fid);
  if (!f || !blob) return null;
  let d;
  if (f.type === "pdf") {
    const buf = new Uint8Array(await blob.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise;
    d = { kind: "pdf", pdf };
  } else {
    const img = await loadImg(URL.createObjectURL(blob));
    d = { kind: "img", img, w: img.naturalWidth, h: img.naturalHeight };
  }
  docCache.set(fid, d);
  return d;
}

// 사진 파일은 png/jpeg로 맞춤 (HEIC 등)
async function normalizeImage(file) {
  if (file.type === "image/png" || file.type === "image/jpeg") return { blob: file, mime: file.type };
  const img = await loadImg(URL.createObjectURL(file));
  const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext("2d").drawImage(img, 0, 0);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.92));
  return { blob, mime: "image/jpeg" };
}

async function addFiles(fileList) {
  const added = [];
  for (const file of fileList) {
    const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    const fid = uid();
    try {
      if (isPdf) {
        const buf = new Uint8Array(await file.arrayBuffer());
        const pdf = await pdfjsLib.getDocument({ data: buf.slice(), isEvalSupported: false }).promise;
        await Local.putBlob(fid, new Blob([buf], { type: "application/pdf" }));
        added.push({ fid, name: file.name, type: "pdf", mime: "application/pdf", pageCount: pdf.numPages });
        pdf.destroy();
      } else {
        const { blob, mime } = await normalizeImage(file);
        await Local.putBlob(fid, blob);
        added.push({ fid, name: file.name, type: "img", mime, pageCount: 1 });
      }
    } catch (e) { toast(`${file.name}: 열 수 없는 파일입니다`, 3500); }
  }
  return added;
}

async function exportXlsx() {

  // 층·부재·결함종류별 물량

    a["개소"] += 1; a["개수 합"] += parseInt(m.count, 10) || 1;
    const l = Number(m.l); if (!isNaN(l) && m.l !== "") a["길이 합"] += l;

/* ---------------- 내보내기: PDF ---------------- */
async function exportPdf() {
  if (!window.PDFLib) throw new Error("PDF 기능을 불러오지 못했습니다 (인터넷 확인)");
  const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
  const out = await PDFDocument.create();
  const font = await out.embedFont(StandardFonts.HelveticaBold);
  const red = rgb(0.84, 0.2, 0.165), white = rgb(1, 1, 1);
  let pagesOut = 0;
  for (const f of S.proj.files) {
    const blob = await Local.getBlob(f.fid);
    if (!blob) continue;
    const buf = await blob.arrayBuffer();
    if (f.type === "pdf") {
      const src = await PDFDocument.load(buf, { ignoreEncryption: true });
      const copied = await out.copyPages(src, src.getPageIndices());
      const d = await getDoc(f.fid);
      for (let i = 0; i < copied.length; i++) {
        const pg = out.addPage(copied[i]);
        const jp = await d.pdf.getPage(i + 1);
        const v = jp.getViewport({ scale: 1 });
        drawMarksPdf(pg, marksOn(`${f.fid}_${i}`), (x, y) => v.convertToPdfPoint(x, y), v.rotation || 0, v.width, v.height);
        pagesOut++;
      }
    } else {
      const img = f.mime === "image/png" ? await out.embedPng(buf) : await out.embedJpg(buf);
      const W = img.width, H = img.height;
      const pg = out.addPage([W, H]);
      pg.drawImage(img, { x: 0, y: 0, width: W, height: H });
      drawMarksPdf(pg, marksOn(`${f.fid}_0`), (x, y) => [x, H - y], 0, W, H);
      pagesOut++;
    }
  }
  if (!pagesOut) throw new Error("이 기기에 도면 파일이 없습니다");
  const bytes = await out.save();
  await saveFile(`${S.proj.name}_결함야장.pdf`, new Blob([bytes], { type: "application/pdf" }));

  function drawMarksPdf(pg, ms, conv, rot, W, H) {
    const u = unitFor(W, H), r = u * 1.05, sw = u * 0.17;
    const P = (q) => conv(q[0], q[1]);
    for (const m of ms) {
      const lp = labelPos(m, u);
      if (m.type === "point") {
        const [x, y] = m.pts[0];
        const dx = lp[0] - x, dy = lp[1] - y, dd = Math.hypot(dx, dy) || 1;
        const a = P([x, y]), b = P([lp[0] - dx / dd * r, lp[1] - dy / dd * r]);
        pg.drawLine({ start: { x: a[0], y: a[1] }, end: { x: b[0], y: b[1] }, thickness: sw, color: red });
        pg.drawCircle({ x: a[0], y: a[1], size: u * 0.38, color: red });
      } else if (m.type === "arrow") {
        const [x, y] = m.pts[0];
        const dx = x - lp[0], dy = y - lp[1], dd = Math.hypot(dx, dy) || 1, ux = dx / dd, uy = dy / dd;
        const hl = u * 1.1, hw = u * 0.55, bx = x - ux * hl, by = y - uy * hl;
        const s0 = P([lp[0] + ux * r, lp[1] + uy * r]), s1 = P([bx, by]);
        pg.drawLine({ start: { x: s0[0], y: s0[1] }, end: { x: s1[0], y: s1[1] }, thickness: sw, color: red });
        const t0 = P([x, y]), t1 = P([bx - uy * hw, by + ux * hw]), t2 = P([bx + uy * hw, by - ux * hw]);
        pg.drawSvgPath(`M ${t0[0]} ${-t0[1]} L ${t1[0]} ${-t1[1]} L ${t2[0]} ${-t2[1]} Z`, { x: 0, y: 0, color: red, borderWidth: 0 });
      } else {
        const a = P(m.pts[0]), b = P(m.pts[1]);
        pg.drawRectangle({ x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), width: Math.abs(a[0] - b[0]), height: Math.abs(a[1] - b[1]), color: red, opacity: 0.12, borderColor: red, borderWidth: sw, borderOpacity: 1, borderDashArray: [u * 0.6, u * 0.35] });
      }
    }
    for (const m of ms) {
      const lp = labelPos(m, u);
      const c = P(lp);
      pg.drawCircle({ x: c[0], y: c[1], size: r, color: white, borderColor: red, borderWidth: sw });
      const t = String(m.no ?? "");
      const fs = u * (t.length >= 3 ? 0.8 : t.length === 2 ? 0.95 : 1.1);
      const w = font.widthOfTextAtSize(t, fs), h = fs * 0.72;
      const th = (rot || 0) * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);
      const ox = -w / 2 * cs + h / 2 * sn, oy = -w / 2 * sn - h / 2 * cs;
      pg.drawText(t, { x: c[0] + ox, y: c[1] + oy, size: fs, font, color: red, rotate: degrees(rot || 0) });
    }
  }
}

/* ---------------- 백업 파일 ---------------- */
async function exportJson() {
  const data = { format: "defect-yajang", version: 1, savedAt: now(), project: metaOf(S.proj), marks: S.proj.marks };
  const d = new Date(); const p = (n) => String(n).padStart(2, "0");
  await saveFile(`${S.proj.name}_백업_${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`, JSON.stringify(data));
}
async function importJson(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast("백업 파일을 읽을 수 없습니다"); return; }
  if (!data || data.format !== "defect-yajang") { toast("결함 야장 백업 파일이 아닙니다"); return; }
  const p = S.proj;
  const sameProject = data.project.id === p.id;
  // 다른 조사에서 온 경우 도면 파일 이름으로 맞춤
  const fidMap = new Map();
  for (const rf of data.project.files || []) {
    const lf = sameProject ? p.files.find((f) => f.fid === rf.fid) : p.files.find((f) => f.name === rf.name && (f.pageCount || 1) === (rf.pageCount || 1));
    if (lf) fidMap.set(rf.fid, lf.fid);
  }
  let skipped = 0; const incoming = [];
  for (const m of data.marks || []) {
    const [rfid, idx] = [m.pageKey.slice(0, m.pageKey.lastIndexOf("_")), m.pageKey.slice(m.pageKey.lastIndexOf("_") + 1)];
    const lfid = fidMap.get(rfid);
    if (!lfid) { skipped++; continue; }
    incoming.push({ ...m, pageKey: `${lfid}_${idx}` });
  }
  for (const [rk, fl] of Object.entries(data.project.floors || {})) {
    const rfid = rk.slice(0, rk.lastIndexOf("_")), idx = rk.slice(rk.lastIndexOf("_") + 1);
    const lfid = fidMap.get(rfid); if (!lfid) continue;
    const lk = `${lfid}_${idx}`; if (!p.floors[lk]) p.floors[lk] = fl;
  }
  pushUndo();
  const before = live().length;
  p.marks = mergeMarks(p.marks, incoming);
  new Set(incoming.map((m) => m.pageKey)).forEach((k) => touch(k)); touch(null);
  closeModal(); renderBar(); renderOverlay(); renderPanel();
  // 같은 층 번호 겹침 확인
  const seen = new Set(); let dup = 0;
  for (const m of live()) { const k = floorOf(m) + "#" + m.no; if (seen.has(k)) dup++; seen.add(k); }
  let msg = `${live().length - before}개 결함을 합쳤습니다`;
  if (skipped) msg += ` · 도면이 맞지 않아 ${skipped}개 제외`;
  if (dup) msg += ` · 같은 층 번호가 ${dup}개 겹칩니다. '층별 번호 다시 매기기'를 눌러주세요`;
  toast(msg, 5000);
}

/* ---------------- 키보드 (사무실 PC) ---------------- */
document.addEventListener("keydown", (e) => {
  if (S.view !== "work" || !$("#modal").hidden) { if (e.key === "Escape") closeModal(); return; }
  const typing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); return; }
  if (typing) return;
  if (e.key === "Escape") { S.sel = null; renderOverlay(); renderPanel(); }
  if (e.key === "ArrowRight" || e.key === "PageDown") showPage(S.cur + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") showPage(S.cur - 1);
  const map = { v: "pan", "1": "point", "2": "arrow", "3": "area" };
  if (map[e.key]) { S.tool = map[e.key]; renderBar(); showHint(); }
});

let wake = null;
async function requestWake() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => (wake = null)); } } catch (e) {} }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { flushLocal(); if (S.proj && Cloud.db) pushCloud(); }
  else if (S.view === "work") requestWake();
});
