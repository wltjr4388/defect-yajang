<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16202b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="결함 야장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>결함 야장</title>
<style>
/* Layout: one-screen field tool. Drawing on the left (paper stays white), input panel on the right, toolbar on top. */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f4f6f8;
  --ink: #16202b;
  --muted: #5a6573;
  --line: #cfd6de;
  --accent: #1d5bd8;
  --accent-ink: #ffffff;
  --mark: #d6332a;
  --ok: #1f8a4c;
  --warn: #b26a00;
  --paper-bg: #c9d0d8;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --tap: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151b; --surface: #19212a; --surface-2: #212a35; --ink: #e5eaf0; --muted: #96a2af;
    --line: #2e3945; --accent: #6e9cff; --accent-ink: #0d1520; --mark: #ff6b5e; --ok: #4cc283;
    --warn: #f0a640; --paper-bg: #0b0f14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #19212a; --surface-2: #212a35; --ink: #e5eaf0; --muted: #96a2af;
  --line: #2e3945; --accent: #6e9cff; --accent-ink: #0d1520; --mark: #ff6b5e; --ok: #4cc283;
  --warn: #f0a640; --paper-bg: #0b0f14; color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button, input, textarea, select { font: inherit; color: inherit; }
/* 아이패드 사파리는 16px보다 작은 입력칸을 누르면 화면 전체를 확대함 */
input, textarea, select { font-size: 16px; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
#app { height: 100%; }

/* ---------- buttons ---------- */
.btn { min-height: var(--tap); padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--mark); border-color: color-mix(in srgb, var(--mark) 45%, var(--line)); }
.btn.danger.armed { background: var(--mark); color: #fff; border-color: var(--mark); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* ---------- home ---------- */
#home { height: 100%; overflow-y: auto; }
.home-inner { max-width: 880px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.intro h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.2; margin: 0 0 10px; text-wrap: balance; }
.intro p { margin: 0 0 18px; color: var(--muted); max-width: 60ch; line-height: 1.6; }
.intro .actions { display: flex; flex-wrap: wrap; gap: 10px; }
.sec-title { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
.plist { display: grid; gap: 8px; }
.prow { display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; overflow: hidden; }
.prow-open { flex: 1; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 16px; background: transparent; border: 0; text-align: left; min-width: 0; }
.prow .more { flex: none; width: 54px; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 22px; line-height: 1; }
.prow.trashed .prow-open { cursor: default; }
.prow .acts { display: flex; gap: 6px; align-items: center; padding: 0 10px; border-left: 1px solid var(--line); }
.ver { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; }
.ver b { color: var(--ink); }
.trash { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.trash > summary { padding: 12px 16px; cursor: pointer; color: var(--muted); font-weight: 500; }
.trash .plist { padding: 0 10px 10px; }
.trash .prow { background: var(--surface-2); }
.prow b { font-size: 16px; overflow-wrap: anywhere; }
.prow .meta { color: var(--muted); font-size: 13px; grid-column: 1; }
.prow .go { grid-row: 1 / span 2; grid-column: 2; color: var(--accent); font-weight: 500; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); margin-left: 6px; vertical-align: 2px; letter-spacing: .03em; }
.empty { padding: 22px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); line-height: 1.6; }
.checklist { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; line-height: 1.7; }
/* 내보내기: 파일마다 칸 하나, 그 파일의 옵션은 칸 안에 */
.xcards { display: grid; gap: 10px; }
.xcard { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 14px; display: grid; gap: 8px; }
.xcard h4 { margin: 0; font-size: 16px; }
.xcard .xd { margin: 0; color: var(--muted); font-size: 13px; }
.xcard .chk { min-height: 36px; padding: 0; }
.xcard .xrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.xcard .xgo { justify-self: end; }
/* 내보내기 전에 빠진 입력 알림 (누르면 그 결함으로 이동) */
.xwarn { border: 1px solid color-mix(in srgb, var(--mark) 45%, var(--line)); background: color-mix(in srgb, var(--mark) 9%, var(--surface)); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; margin-bottom: 10px; }
.xwarn b { font-size: 14px; }
.xwarn .xwl { display: grid; max-height: 150px; overflow-y: auto; }
.xwarn .xwl button { display: flex; justify-content: space-between; gap: 10px; min-height: 36px; padding: 0 2px; border: 0; border-top: 1px solid color-mix(in srgb, var(--mark) 20%, var(--line)); background: none; color: var(--ink); text-align: left; font-size: 14px; }
.xwarn .xwl button span { color: var(--mark); font-size: 13px; }
.checklist ol { margin: 6px 0 0; padding-left: 20px; }
.checklist b { color: var(--ink); }

/* ---------- work ---------- */
#work { height: 100%; display: flex; flex-direction: column; }
.bar { display: grid; background: var(--surface); border-bottom: 1px solid var(--line); }
/* 굿노트처럼 2줄: 위 = 홈·조사 이름·도면 넘기기·설정·내보내기, 아래 = 가운데 아이콘 도구 */
.bar-top, .bar-tools { display: flex; align-items: center; gap: 8px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); min-width: 0; }
.bar-top { padding-block: 6px; }
.bar-tools { display: grid; grid-template-columns: 1fr auto 1fr; padding-block: 2px 4px; border-top: 1px solid var(--line); }
.bar-tools .bt-l, .bar-tools .bt-r { display: flex; gap: 4px; align-items: center; }
.bar-tools .bt-r { justify-content: flex-end; }
.chips .brk { flex-basis: 100%; height: 0; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.pair .x { color: var(--muted); }
.rbxyz { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rbax { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px; }
.rbax b { font-size: 14px; color: var(--muted); }
.rbax .inp { padding: 0 6px; }
.rbfill { justify-self: start; margin-top: 2px; }
.kdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; margin-right: 6px; vertical-align: 1px; }
.htabs { margin: 4px 0 2px; }
.htabs button { min-height: 44px; font-size: 16px; padding: 0 16px; }
.prow.k-defect { border-left: 4px solid var(--mark); }
.prow.k-equip { border-left: 4px solid #0a7f8c; }
.ibtn { width: 44px; min-height: 44px; padding: 0; border: 0; background: none; border-radius: 10px; display: inline-grid; place-items: center; color: var(--ink); }
.ibtn:disabled { opacity: .35; }
.ibtn svg { width: 22px; height: 22px; }
.ibtn.lbl { width: auto; padding: 2px 8px; gap: 1px; font-size: 11px; color: var(--muted); }
.ibtn.lbl svg { color: var(--ink); }
.ibtn.on { color: var(--warn); }
.ibtn.on svg { color: var(--warn); }
.bar-top .pname { flex: 0 1 auto; min-width: 0; }
.bar-top .pager { min-width: 0; flex: 0 1 auto; }
.btn.share svg { width: 18px; height: 18px; }
.bar .sep { width: 1px; height: 28px; background: var(--line); }
.bar .grow { flex: 1; }
.pname { font-weight: 700; max-width: 12ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager { display: inline-flex; align-items: center; gap: 4px; }
.pager .pg { min-width: 0; max-width: 20ch; overflow: hidden; text-overflow: ellipsis; }
.floor-btn { font-weight: 700; border-color: var(--ink); }
.floor-btn.unset { color: var(--warn); border-color: var(--warn); }
.btn.finger { white-space: nowrap; font-size: 14px; }
.btn.finger.on { color: var(--warn); border-color: var(--warn); }
.tools { display: inline-flex; gap: 4px; }
.tools button { min-height: 46px; min-width: 56px; padding: 3px 8px; border: 0; border-radius: 10px; background: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; font-weight: 500; color: var(--muted); }
.tools button svg { color: var(--ink); }
.tools button[aria-pressed="true"], .tools button[aria-pressed="true"] svg { background: var(--accent); color: var(--accent-ink); }
.tools button[aria-pressed="true"] svg { background: none; }
.tools svg { width: 22px; height: 22px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.ok i { background: var(--ok); }
.sync.busy i { background: var(--accent); }
.sync.warn { color: var(--warn); }
.sync.warn i { background: var(--warn); }
.sync.bad { color: #fff; background: var(--mark); }
.sync.bad i { background: #fff; }

.main { flex: 1; min-height: 0; display: flex; }
#vp { position: relative; flex: 1 1 64%; min-width: 0; overflow: hidden; background: var(--paper-bg); touch-action: none; user-select: none; -webkit-user-select: none; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: 0 2px 14px rgba(0,0,0,.18); background: #fff; }
#cv, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#vp .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
#penbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; width: max-content; max-width: calc(100% - 20px); padding: 6px 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.18); touch-action: manipulation; }
#penbar .pb-row { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
#penbar .pb-row > * { flex: 0 0 auto; }
#penbar .swatch { width: 34px; height: 34px; }
#penbar .sep { width: 1px; height: 26px; background: var(--line); margin: 0 4px; }
.pb-w { width: 40px; height: 40px; border: 0; border-radius: 8px; background: none; display: grid; place-items: center; }
.pb-w i { display: block; width: 24px; border-radius: 4px; }
.pb-er { width: auto; padding: 0 10px; display: inline-flex; gap: 6px; }
.pb-er i { border-radius: 50%; border: 2px solid var(--ink); background: none; }
.pb-er b { font-size: 15px; }
#penbar .pb-lab { font-size: 13px; font-weight: 700; color: var(--muted); padding: 0 4px; white-space: nowrap; }
.pb-w[aria-pressed="true"] { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--ink); }
#hint { position: absolute; left: 12px; bottom: 12px; background: rgba(22,32,43,.82); color: #fff; font-size: 13px; padding: 6px 10px; border-radius: 6px; pointer-events: none; }

#panel { flex: 0 0 min(390px, 36%); min-width: 300px; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding-block: 14px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.ph .t { display: grid; gap: 2px; }
.ph .eyebrow { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.ph .big { font-size: 22px; font-weight: 700; }
.ph .big .num { color: var(--mark); }
.fld { display: grid; gap: 6px; }
.fld > .lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .05em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.add { border-style: dashed; color: var(--muted); }
.inp { min-height: var(--tap); width: 100%; min-width: 0; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
textarea.inp { padding: 8px 10px; min-height: 64px; resize: vertical; line-height: 1.5; }
.row2 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
.row2 .x { padding-bottom: 12px; color: var(--muted); }
/* 폭 × 길이 · 개수 한 줄 */
.row-wlc { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; }
.row-wlc .inp { min-width: 0; width: 100%; }
.row-wlc .stepper button { width: 34px; }
.row-wlc .stepper input { width: 36px; }
.row-photo { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: end; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { width: 40px; min-height: var(--tap); border: 0; background: var(--surface-2); font-size: 18px; }
.stepper input { width: 44px; text-align: center; border: 0; background: var(--surface); min-height: var(--tap); }
.photo-wrap { display: grid; grid-template-columns: auto 1fr auto auto; gap: 6px; }
.photo-wrap .pm { width: 44px; padding: 0; font-size: 20px; }
.sugg { font-size: 12px; padding: 0 10px; }
.ph .big button.no-edit { font: inherit; border: 0; background: none; padding: 0; color: inherit; display: inline-flex; align-items: baseline; gap: 6px; }
.ph .big button.no-edit small { font-size: 12px; font-weight: 500; color: var(--accent); }
.dtabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); }
.dtabs button { min-height: 40px; padding: 0 12px; border: 0; border-bottom: 3px solid transparent; background: none; font-weight: 500; color: var(--muted); margin-bottom: -1px; }
.dtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.dtabs button i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 4px; vertical-align: 2px; }
/* 입력창을 완료 버튼까지 한 화면에: 선택 줄은 항목 이름 옆, 버튼·간격 조금 줄임, 메모는 한 줄로 시작 */
.fld.sel-top { grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; }
.fld.sel-top > * { grid-column: 1 / -1; }
.fld.sel-top > .lab { grid-column: 1; grid-row: 1; align-self: center; }
.fld.sel-top > .sel-line { grid-column: 2; grid-row: 1; }
#panel .chip, #panel .dtabs button { min-height: 36px; }
#panel:has(#f-done) { gap: 6px; }
.fld.inl { grid-template-columns: 52px minmax(0, 1fr); align-items: center; column-gap: 8px; }
#panel:has(#f-done) { padding-bottom: 12px; }
textarea.inp.memo1 { min-height: 44px; resize: none; overflow: hidden; }
.sel-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 28px; font-size: 13px; color: var(--muted); }
.sel-line .tagx { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--ink); font-size: 13px; font-weight: 500; border: 0; }
.sel-line .tagc { margin: 0 -2px 0 -4px; color: var(--muted); }
.sel-line .tagx span { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.cur-photo { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.cur-photo .inp { background: var(--surface); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.swatch[data-slot] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.swatch.editing { box-shadow: 0 0 0 3px var(--accent); }
.pal-tip { margin-top: 10px; font-size: 13px; color: var(--muted); }
.pal-tip .linkbtn { border: 0; background: none; padding: 4px 2px; color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; }
.swatch.more { background: none; border: 2px dashed var(--muted); box-shadow: none; color: var(--ink); display: inline-grid; place-items: center; padding: 0; }   /* 색 추가: 빈 동그라미 + (글자 말고 선으로: 글꼴 따라 위아래 치우침) */
.swatch.more svg { width: 55%; height: 55%; display: block; }
.swatch.more[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--accent); }
.palette { display: grid; grid-template-columns: repeat(13, 1fr); margin-top: 10px; border-radius: 10px; overflow: hidden; max-width: 420px; }
.palette button { aspect-ratio: 1; border: 0; padding: 0; min-width: 0; }
.palette button[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: -3px; box-shadow: inset 0 0 0 5px #fff; }
.wchip { display: inline-flex; align-items: center; gap: 8px; }
.wchip i { display: inline-block; width: 22px; border-radius: 4px; background: currentColor; }
.pen-opts { display: grid; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.chk { display: flex; align-items: center; gap: 10px; min-height: var(--tap); padding: 0 4px; }
.chk input { width: 22px; height: 22px; }
.pfoot { display: flex; gap: 8px; margin-top: 4px; }
.pfoot .btn { flex: 1; }
/* 결함 입력창: 위에 요약 한 줄, 항목마다 구분선 + 진한 이름, 삭제는 아래 */
.ph .meta { font-size: 13px; font-weight: 600; color: var(--muted); align-self: center; white-space: nowrap; }
.msum { font-size: 14px; line-height: 1.4; color: var(--ink); padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.msum.empty { color: var(--muted); }
#panel .sec { border: 1px solid var(--line); border-radius: 12px; padding: 5px 10px 7px; }
#panel .sec.fld { gap: 4px; }
#panel .sec .lab { font-size: 14px; color: var(--ink); letter-spacing: 0; }
.pfoot .btn.del { flex: none; padding: 0 14px; }
.list { display: grid; gap: 4px; }

const Local = (() => {

  let available = null;
  function open() {
    if (dbp) return dbp;

      try {
        const r = indexedDB.open("defect-yajang", 1);

        t.onerror = () => { available = false; res(undefined); };
        t.onabort = () => { available = false; res(undefined); };
      } catch (e) { available = false; res(undefined); }
    }));

    get available() { return available; },
    open,
    async putProject(p) { mem.projects.set(p.id, p); await run("projects", "readwrite", (s) => s.put(clone(p))); },
    async getProjects() {

async function saveFile(filename, data) {
  if (Cloud.dl) {
    try { await Cloud.dl.save({ filename, data }); toast("저장했습니다: " + filename); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === "declined") toast("저장을 취소했습니다");
      else if (c === "rate_limited") toast("저장 창이 이미 열려 있습니다. 잠시 후 다시 눌러주세요");
      else toast("파일 저장 실패: " + ((e && e.message) || c || e));
    }
    return false;
  }
  if (window.claude && !Cloud.ready) { toast("준비 중입니다. 잠시 후 다시 눌러주세요"); return false; }
  const blob = data instanceof Blob ? data : new Blob([data]);
  // 아이패드: 공유 시트로 저장 ("파일에 저장" 또는 카톡 전송)
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isIOS && navigator.canShare) {
    try {
      // 파일 종류를 확장자로 알려줌 (종류가 비어 있으면 카톡 등 공유 대상에 안 뜸)
      const ext = { json: "application/json", pdf: "application/pdf", xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }[filename.split(".").pop().toLowerCase()];
      const file = new File([blob], filename, { type: blob.type || ext || "application/octet-stream" });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); toast("저장했습니다: " + filename); return true; }
    } catch (e) { if (e && e.name === "AbortError") { toast("저장을 취소했습니다"); return false; } }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}

function sizeFactor() { return (S.proj && S.proj.prefs && S.proj.prefs.size) || 1; }
// 결함종류는 "수직균열, 미장 박리, 박락"처럼 쉼표로 이어 저장 (앞말이 같으면 뒤에선 뺌: 미장 박리 + 미장 박락 → 미장 박리, 박락)

// 사진번호 숫자 부분만 d만큼 바꿈 (IMG_0123 → IMG_0124)
function bumpPhoto(src, d) {

async function uploadMissingAssets(p) {
  if (!Cloud.assets) return false;
  let changed = false;
  for (const f of p.files) {
    if (f.assetId || f.tooBig) continue;
    const blob = await Local.getBlob(f.fid);
    if (!blob) continue;
    if (blob.size > 20 * 1024 * 1024) { f.tooBig = true; continue; }
    const type = f.type === "pdf" ? "application/pdf" : (f.mime || "image/jpeg");
    try { const r = await Cloud.assets.upload(blob, { type }); f.assetId = r.id; changed = true; }
    catch (e) { if (e && (e.code === "too_large" || e.code === "unsupported_type")) f.tooBig = true; else throw e; }
  }
  return changed;
}

async function pushCloud() {
  const p = S.proj;
  if (!p || !Cloud.db) { updateSync(); return; }
  if (cloudBusy) { scheduleCloud(1500); return; }
  if (navigator.onLine === false) { S.sync.state = "offline"; updateSync(); return; }
  cloudBusy = true; S.sync.state = "busy"; updateSync();
  const pages = [...dirtyPages]; dirtyPages.clear();
  let gotRemote = false;
  try {
    await uploadMissingAssets(p);
    for (const pk of pages) {
      const ref = Cloud.db.doc(`projects/${p.id}/marks/${pk}`);
      let remote = [], remoteN = [];
      const snap = await ref.get();
      if (snap.exists) { remote = (snap.data().marks) || []; remoteN = (snap.data().notes) || []; }
      const local = p.marks.filter((m) => m.pageKey === pk);
      const localN = (p.notes || []).filter((n) => n.pageKey === pk);
      const merged = mergeMarks(remote, local), mergedN = mergeMarks(remoteN, localN);
      if (merged.length !== local.length || merged.some((m) => !local.includes(m))) gotRemote = true;
      if (mergedN.length !== localN.length || mergedN.some((n) => !localN.includes(n))) gotRemote = true;
      await ref.set({ marks: merged, notes: mergedN, updatedAt: now() });
      p.marks = p.marks.filter((m) => m.pageKey !== pk).concat(merged);
      p.notes = (p.notes || []).filter((n) => n.pageKey !== pk).concat(mergedN);
    }
    await Cloud.db.doc(`projects/${p.id}`).set(metaOf(p));
    S.sync.state = "ok"; S.sync.at = now(); S.sync.msg = "";
    flushLocal();
    if (gotRemote && S.proj === p) { renderOverlay(); renderPanel(); }
  } catch (e) {
    pages.forEach((k) => dirtyPages.add(k));
    S.sync.state = navigator.onLine === false ? "offline" : "error";
    S.sync.msg = (e && (e.code || e.message)) || String(e);
    if (e && e.code === "quota_exceeded") toast("클라우드 저장 공간이 찼습니다. 백업 파일로 저장해주세요", 4000);
    scheduleCloud(30000);
  }
  cloudBusy = false; updateSync();
}

// 클라우드 내용을 받아서 기기 내용과 합침
async function pullCloud(id, quiet) {
  if (!Cloud.db) return null;
  try {
    const metaSnap = await Cloud.db.doc(`projects/${id}`).get();
    if (!metaSnap.exists) return null;
    const meta = metaSnap.data();
    const ms = await Cloud.db.collection(`projects/${id}/marks`).get();
    let remoteMarks = [], remoteNotes = [];
    ms.docs.forEach((d) => { const v = d.data(); if (v && Array.isArray(v.marks)) remoteMarks = remoteMarks.concat(v.marks); if (v && Array.isArray(v.notes)) remoteNotes = remoteNotes.concat(v.notes); });
    let p = (S.proj && S.proj.id === id) ? S.proj : await Local.getProject(id);
    if (!p) p = { id, name: meta.name, createdAt: meta.createdAt, updatedAt: meta.updatedAt, files: [], floors: {}, marks: [], notes: [], photoRanges: {}, prefs: meta.prefs || {}, trashedAt: meta.trashedAt || 0 };
    // 파일 목록 합치기
    for (const rf of meta.files || []) {
      let lf = p.files.find((f) => f.fid === rf.fid);
      if (!lf) { lf = { ...rf }; p.files.push(lf); }
      else if (!lf.assetId && rf.assetId) lf.assetId = rf.assetId;
      if (!(await Local.getBlob(lf.fid)) && lf.assetId) {
        try { const r = await fetch("/_blob/" + lf.assetId); if (r.ok) await Local.putBlob(lf.fid, await r.blob()); } catch (e) { /* 도면 못 받음 */ }
      }
    }
    const localNewer = (p.updatedAt || 0) >= (meta.updatedAt || 0);
    p.floors = localNewer ? { ...(meta.floors || {}), ...(p.floors || {}) } : { ...(p.floors || {}), ...(meta.floors || {}) };
    p.photoRanges = localNewer ? { ...(meta.photoRanges || {}), ...(p.photoRanges || {}) } : { ...(p.photoRanges || {}), ...(meta.photoRanges || {}) };
    if (!localNewer) { if (meta.prefs) p.prefs = meta.prefs; if (meta.name) p.name = meta.name; p.trashedAt = meta.trashedAt || 0; }
    const before = p.marks.length + (p.notes || []).length;
    p.marks = mergeMarks(remoteMarks, p.marks);
    p.notes = mergeMarks(remoteNotes, p.notes || []);
    await Local.putProject(p);
    if (S.proj && S.proj.id === id) {
      S.proj = p; buildPages(); renderBar(); renderOverlay(); renderPanel();
      if (!quiet && p.marks.length + p.notes.length !== before) toast("다른 기기에서 작업한 내용을 합쳤습니다");
    }
    return p;
  } catch (e) { if (!quiet) toast("클라우드에서 불러오지 못했습니다"); return null; }
}

function updateSync() {
  const el = $("#sync"); if (!el) return;
  let cls = "", txt = "";
  const localBad = Local.available === false;
  if (Cloud.db) {
    const st = S.sync.state;

/* ---------------- 도면 열기 ---------------- */
const docCache = new Map();
function loadImg(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
async function getDoc(fid) {
  if (docCache.has(fid)) return docCache.get(fid);
  const f = S.proj.files.find((x) => x.fid === fid);
  const blob = await Local.getBlob(fid);
  if (!f || !blob) return null;
  let d;
  if (f.type === "pdf") {
    const buf = new Uint8Array(await blob.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise;
    d = { kind: "pdf", pdf };
  } else {
    const img = await loadImg(URL.createObjectURL(blob));
    d = { kind: "img", img, w: img.naturalWidth, h: img.naturalHeight };
  }
  docCache.set(fid, d);
  return d;
}

// 사진 파일은 png/jpeg로 맞춤 (HEIC 등)
async function normalizeImage(file) {
  if (file.type === "image/png" || file.type === "image/jpeg") return { blob: file, mime: file.type };
  const img = await loadImg(URL.createObjectURL(file));
  const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext("2d").drawImage(img, 0, 0);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.92));
  return { blob, mime: "image/jpeg" };
}

async function addFiles(fileList) {
  const added = [];
  for (const file of fileList) {
    const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    const fid = uid();
    try {
      if (isPdf) {
        const buf = new Uint8Array(await file.arrayBuffer());
        const pdf = await pdfjsLib.getDocument({ data: buf.slice(), isEvalSupported: false }).promise;
        await Local.putBlob(fid, new Blob([buf], { type: "application/pdf" }));
        added.push({ fid, name: nfc(file.name), type: "pdf", mime: "application/pdf", pageCount: pdf.numPages });
        pdf.destroy();
      } else {
        const { blob, mime } = await normalizeImage(file);
        await Local.putBlob(fid, blob);
        added.push({ fid, name: nfc(file.name), type: "img", mime, pageCount: 1 });
      }
    } catch (e) { toast(`${file.name}: 열 수 없는 파일입니다`, 3500); }
  }
  return added;
}

// 홈 화면 앱: GitHub의 version.json과 지금 버전 비교, 다르면 새 버전 받아서 다시 열기
async function checkUpdate(btn) {
  if (navigator.onLine === false) { toast("인터넷에 연결된 곳에서 눌러주세요"); return; }
  btn.disabled = true; btn.textContent = "확인 중…";
  let v = null;
  try { const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); v = await r.json(); } catch (e) {}
  btn.disabled = false; btn.textContent = "업데이트 확인";
  if (!v || !v.build) { toast("버전을 확인하지 못했습니다. 인터넷 연결을 확인해주세요"); return; }
  if (v.build === window.DY_BUILD) { toast(`최신 버전입니다 (${v.built})`); return; }
  toast(`새 버전(${v.built})을 받는 중… 잠시 후 다시 열립니다`, 8000);
  try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
  // 새 버전이 적용되면 자동으로 다시 열림. 안 되면 직접 새로 열기
  setTimeout(() => location.reload(), 6000);
}

function confirmModal(title, msg, okLabel, cb) {

    <div class="sheet-foot"><button class="btn ghost" data-close>취소</button><button class="btn danger armed" id="cf-ok">${esc(okLabel)}</button></div>`);

// 기기에 있으면 기기 것을, 클라우드에만 있으면 클라우드 것을 고침
async function editProjectMeta(id, fn) {
  const p = await Local.getProject(id);
  if (p) {
    fn(p); p.updatedAt = now(); await Local.putProject(p);
    if (Cloud.db) { try { await Cloud.db.doc(`projects/${id}`).set(metaOf(p)); } catch (e) {} }
    return;
  }
  if (!Cloud.db) return;
  try {
    const ref = Cloud.db.doc(`projects/${id}`); const snap = await ref.get();
    if (!snap.exists) return;
    const m = snap.data(); fn(m); m.updatedAt = now(); await ref.set(m);
  } catch (e) { toast("클라우드에 반영하지 못했습니다"); }
}
async function purgeProject(id) {
  const p = await Local.getProject(id);
  if (p) { for (const f of p.files || []) await Local.delBlob(f.fid); await Local.delProject(id); }
  if (Cloud.db) {
    try {
      const ms = await Cloud.db.collection(`projects/${id}/marks`).get();
      for (const d of ms.docs) { const r = Cloud.db.doc(`projects/${id}/marks/${d.id}`); if (typeof r.delete === "function") await r.delete(); }
      const r = Cloud.db.doc(`projects/${id}`); if (typeof r.delete === "function") await r.delete();
    } catch (e) {}
  }
}

async function openById(id) {
  let p = await Local.getProject(id);

  if (!p) { toast("조사를 열 수 없습니다"); return; }
  openProject(p);
}

async function createSample() {
  const c = document.createElement("canvas"); c.width = 1800; c.height = 1100;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = "#999"; g.setLineDash([14, 8]); g.lineWidth = 2;
  const xs = [150, 600, 1050, 1500], ys = [180, 560, 940];
  xs.forEach((x) => { g.beginPath(); g.moveTo(x, 90); g.lineTo(x, 1030); g.stroke(); });
  ys.forEach((y) => { g.beginPath(); g.moveTo(70, y); g.lineTo(1600, y); g.stroke(); });
  g.setLineDash([]); g.strokeStyle = "#222"; g.lineWidth = 9; g.strokeRect(150, 180, 1350, 760);
  g.lineWidth = 5; g.beginPath(); g.moveTo(600, 180); g.lineTo(600, 940); g.moveTo(1050, 560); g.lineTo(1500, 560); g.stroke();
  g.fillStyle = "#333"; xs.forEach((x) => ys.forEach((y) => g.fillRect(x - 22, y - 22, 44, 44)));
  g.font = "bold 30px sans-serif"; g.fillStyle = "#222";
  ["X1", "X2", "X3", "X4"].forEach((t, i) => g.fillText(t, xs[i] - 18, 70));
  ["Y3", "Y2", "Y1"].forEach((t, i) => g.fillText(t, 20, ys[i] + 10));
  g.font = "bold 40px sans-serif"; g.fillText("3층 평면도 (예시)", 1250, 1085);
  const blob = await new Promise((r) => c.toBlob(r, "image/png"));
  const fid = uid(); await Local.putBlob(fid, blob);
  const p = { id: uid(), name: "연습용 예시 조사", createdAt: now(), updatedAt: now(), files: [{ fid, name: "예시_3층평면도.png", type: "img", mime: "image/png", pageCount: 1 }], floors: { [`${fid}_0`]: "3층" }, marks: [], prefs: {} };
  await Local.putProject(p);
  openProject(p);
}

function numberModal(m) {

  const inp = $("#nm-in");

    $("#nm-ins").onclick = () => {

function focusMark(m) {

}

function renumberAll() {
  pushUndo();
  const order = new Map(S.pages.map((p, i) => [p.key, i]));
  const byFloor = new Map();
  for (const m of live()) { const f = floorOf(m); if (!byFloor.has(f)) byFloor.set(f, []); byFloor.get(f).push(m); }
  const t = now(); const pages = new Set();
  byFloor.forEach((arr) => {
    arr.sort((a, b) => (order.get(a.pageKey) - order.get(b.pageKey)) || ((a.no || 0) - (b.no || 0)) || ((a.createdAt || 0) - (b.createdAt || 0)));
    arr.forEach((m, i) => { if (m.no !== i + 1) { m.no = i + 1; m.updatedAt = t; pages.add(m.pageKey); } });
  });
  pages.forEach((k) => touch(k));
  renderOverlay(); renderPanel(); renderBar();
  toast(pages.size ? "층별 번호를 다시 매겼습니다" : "번호가 이미 정리되어 있습니다");

const asNum = (v) => (v !== "" && v != null && !isNaN(Number(v)) ? Number(v) : (v ?? ""));
// 3종 정기점검 양식(외관조사결함표, 사진첩 xlsm)의 '외관조사 결과표'와 같은 칸: 6행부터 B~P
// → 엑셀에서 B6:P(끝)를 복사해 양식 6행에 붙여넣으면 됨. 표기는 양식에 쓰던 문구로 바꿈
function f3Floor(f) {
  const s = String(f || "").trim(); let m;
  if ((m = s.match(/^(\d+)층$/))) return { name: "지상" + m[1] + "층", code: m[1] };
  if ((m = s.match(/^지상(\d+)층$/))) return { name: s, code: m[1] };
  if ((m = s.match(/^(?:지하|B)\s*(\d+)/i))) return { name: "지하" + m[1] + "층", code: "B" + m[1] };
  if (/지붕|옥상/.test(s)) return { name: "지붕층", code: "R" };
  if (/옥탑/.test(s)) return { name: "옥탑층", code: "PH" };
  return { name: s, code: s };
}
async function exportXlsx() {
  if (!window.XLSX) throw new Error("엑셀 기능을 불러오지 못했습니다 (인터넷 확인)");
  // 층 순서는 내보내기 창에서 고름: 최상층부터(양식 기본, 지붕층 → … → 지하) 또는 최하층부터. 외부 등 그 밖의 층은 항상 맨 뒤
  const down = (S.proj.prefs.floorOrder || "top") === "top";
  const fk = (m) => { const k = floorKey(floorOf(m)); return k >= 5000 ? -1e5 : down ? k : -k; };
  const marks = sortedRows().sort((a, b) => (fk(b) - fk(a)) || String(floorOf(a)).localeCompare(String(floorOf(b))) || ((a.no || 0) - (b.no || 0)));
  // 빈 값은 칸을 아예 안 만듦 (빈 글자가 들어가면 양식 물량 수식이 #VALUE!)
  const ws = {}, put = (ref, v) => (v.f || (v.v !== "" && v.v != null) ? (ws[ref] = v) : v);
  const str = (v) => ({ t: "s", v: nfc(v) }), num = (v) => { const n = asNum(v); return typeof n === "number" ? { t: "n", v: n } : str(n); };
  put("B3", str(`『${S.proj.name}』 외관조사 결과표`));
  [["B4", "번호"], ["C4", "위치"], ["D4", "층"], ["E4", "부재명"], ["F4", "결함유형"], ["G4", "결함규격"], ["L4", "발생원인"], ["M4", "보수방안"], ["N4", "우선순위"], ["O4", "사진 번호"], ["P5", "사진번호"],
    ["G5", "폭(㎜)/너비(m)"], ["H5", "길이"], ["I5", "단위"], ["J5", "개소"], ["K5", "물량"], ["Q4", "메모(참고)"]].forEach(([r, v]) => put(r, str(v)));
  // 셀 병합·셀 메모·줄바꿈은 안 씀: 아이패드 미리보기가 병합 제목 행을 화면 가득 늘려 표가 안 보였음
  let r = 6;
  marks.forEach((m, i) => {
    const fl = f3Floor(floorOf(m));
    const member = m.member || "";   // 부재명은 앱 표기 그대로 (천장 보, 천장 슬래브, 기둥+조적벽체 — 사용자 지정)
    // 수직+수평균열 → 수직, 수평균열 / 접합부 이격 균열 → 이질재료 접합부 이격 / 미장 박리 → 미장박리 (콘크리트는 띄어 씀)
    const defect = typeLabel(m.dtype).replace(/접합부 이격 균열/g, "이질재료 접합부 이격").replace(/(수직|수평|경사)\+/g, "$1, ").replace(/(미장|도장) /g, "$1");
    const each = splitTypes(m.dtype).map((t) => t.replace(/접합부 이격 균열/, "이질재료 접합부 이격").replace(/(미장|도장) /, "$1"));
    const linear = each.length && each.every((t) => /이격/.test(t) || (/균열/.test(t) && !/망상/.test(t)));
    const unit = !each.length && !m.w && !m.l ? "" : linear ? "m" : "㎡";
    put(`B${r}`, str(fl.code && m.no ? `${fl.code}-${m.no}` : m.no || ""));
    put(`D${r}`, str(fl.name)); put(`E${r}`, str(member));
    put(`F${r}`, str(defect));
    const chk = [];
    put(`G${r}`, num(m.w)); put(`H${r}`, num(m.l)); put(`I${r}`, str(unit)); put(`J${r}`, num(m.count || 1));
    if (unit === "㎡" && widthUnit(m) === "mm" && m.w) chk.push("앱에서 폭을 mm로 입력함 → 너비(m) 확인");
    // 물량: 양식 수식 + 미리 계산한 값 (아이패드 미리보기는 수식을 계산 안 하고 이 값을 보여줌)
    const qty = (() => { const W = Number(m.w) || 0, L = Number(m.l) || 0, C = Number(m.count) || 1, q = (v) => String(Math.round(v * 1e6) / 1e6);
      return unit === "m" ? q(L * C) + "m" : unit === "㎡" ? q(W * L * C) + "㎡" : "-"; })();
    put(`K${r}`, { t: "s", v: qty, f: `IF(I${r}="m",H${r}*J${r}&"m",IF(I${r}="㎡",G${r}*H${r}*J${r}&"㎡",IF(I${r}="EA",J${r}&"EA","-")))` });
    // 발생원인·보수방안·우선순위(L·M·N)는 비워 둠: 회사마다 기준이 달라 PC에서 따로 정리
    put(`O${r}`, { t: "n", v: i + 1 }); put(`P${r}`, str(m.photo || ""));
    put(`Q${r}`, str([m.memo, ...chk.map((x) => "※ " + x)].filter(Boolean).join(" / ")));
    r++;
  });
  put(`B${r}`, str("- 이 하 여 백 -"));
  ws["!ref"] = `A1:Q${r}`;
  ws["!rows"] = Array.from({ length: r }, () => ({ hpt: 18 }));
  // C 위치, N 우선순위, O 사진 순번은 숨김 (양식과 같게, 붙여넣을 땐 같이 복사됨)
  ws["!cols"] = [3, 7, 8, 9, 14, 22, 8, 7, 5, 5, 9, 14, 15, 6, 5, 9, 24].map((w, i) => ({ wch: w, hidden: [2, 13, 14].includes(i) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "외관조사 결과표");
  // bookSST: 글자를 공유 문자열로 저장 (안 하면 t="str"로 써서 아이패드 미리보기에 글자가 안 보임)
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array", bookSST: true });
  await saveFile(`${S.proj.name}_외관조사 결과표.xlsx`, new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}

/* ---------------- 장비조사: 항목 번호 · 엑셀 ---------------- */
// 층 순서(내보내기 창의 지붕→지하 / 지하→지붕) → 위치 번호 순
function equipOrdered() {
  const down = (S.proj.prefs.floorOrder || "top") === "top";
  const fk = (m) => { const k = floorKey(floorOf(m)); return k >= 5000 ? -1e5 : down ? k : -k; };
  return [...live()].sort((a, b) => (fk(b) - fk(a)) || ((a.no || 0) - (b.no || 0)));
}
// 그 항목을 한 위치만 골라 R-1, R-2 … (id → 번호)
function equipLabels(key) {
  const it = EQUIP_ITEMS.find((x) => x.key === key), map = new Map(); let i = 0;
  for (const m of equipOrdered()) if ((m.items || []).includes(key)) map.set(m.id, `${it ? it.prefix : ""}${++i}`);
  return map;
}
async function exportEquipXlsx() {
  if (!window.XLSX) throw new Error("엑셀 기능을 불러오지 못했습니다 (인터넷 확인)");
  const wb = XLSX.utils.book_new();
  for (const it of EQUIP_ITEMS) {
    const lab = equipLabels(it.key), k = it.key;
    // 항목별 칸: 철근배근 X·Y·Z / 압축강도 범위(42~45) / 부재규격 400×600
    const head = { rebar: ["X", "Y", "Z"], comp: ["범위"], size: ["규격(mm)"] }[k] || [];
    const vals = (m) => (k === "rebar" ? rbVals(m).map(nfc) : k === "comp" ? [compText(m)] : k === "size" ? [sizeText(m)] : []);
    const rows = equipOrdered().filter((m) => lab.has(m.id)).map((m) => [lab.get(m.id), f3Floor(floorOf(m)).name, nfc(m.member || ""), m.type !== "arrow" ? m.pos || "" : "", ...vals(m), nfc(m.memo || ""), m.no]);
    const ws = XLSX.utils.aoa_to_sheet([["번호", "층", "부재", "단부/중앙부", ...head, "메모", "현장 위치번호"], ...rows]);
    ws["!cols"] = [8, 10, 16, 10, ...head.map(() => 11), 24, 12].map((w) => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, it.name);
  }
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array", bookSST: true });
  await saveFile(`${S.proj.name}_장비조사.xlsx`, new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}

/* ---------------- 내보내기: PDF ---------------- */
async function exportPdf() {
  if (!window.PDFLib) throw new Error("PDF 기능을 불러오지 못했습니다 (인터넷 확인)");
  const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
  const out = await PDFDocument.create();
  const font = await out.embedFont(StandardFonts.HelveticaBold);
  const RED = rgb(0.84, 0.2, 0.165), BLUE = rgb(0.11, 0.36, 0.85), white = rgb(1, 1, 1);
  let red = RED;   // 표시마다 바뀜: 장비 점(수평부재)은 파랑
  // 장비: 고른 항목을 한 위치만, 번호는 항목 번호(R-1…)로
  const eqItem = isEquip() ? S.proj.prefs.pdfItem || "all" : null, eqLab = eqItem && eqItem !== "all" ? equipLabels(eqItem) : null;
  const eqAllLabs = eqItem === "all" ? EQUIP_ITEMS.map((it) => equipLabels(it.key)) : null;
  const pick = (key) => (eqLab ? marksOn(key).filter((m) => eqLab.has(m.id)).map((m) => ({ ...m, no: eqLab.get(m.id) })) : marksOn(key));
  const withNotes = S.proj.prefs.printNotes !== false;
  let pagesOut = 0;
  for (const f of S.proj.files) {
    const blob = await Local.getBlob(f.fid);
    if (!blob) continue;
    const buf = await blob.arrayBuffer();
    if (f.type === "pdf") {
      const src = await PDFDocument.load(buf, { ignoreEncryption: true });
      const copied = await out.copyPages(src, src.getPageIndices());
      const d = await getDoc(f.fid);
      for (let i = 0; i < copied.length; i++) {
        const pg = out.addPage(copied[i]);
        const jp = await d.pdf.getPage(i + 1);
        const v = jp.getViewport({ scale: 1 });
        const conv = (x, y) => v.convertToPdfPoint(x, y);
        await drawLayerPdf(out, pg, `${f.fid}_${i}`, conv, v.width, v.height);
        drawMarksPdf(pg, pick(`${f.fid}_${i}`), conv, v.rotation || 0, v.width, v.height);
        pagesOut++;
      }
    } else {
      const img = f.mime === "image/png" ? await out.embedPng(buf) : await out.embedJpg(buf);
      const W = img.width, H = img.height;
      const pg = out.addPage([W, H]);
      pg.drawImage(img, { x: 0, y: 0, width: W, height: H });
      await drawLayerPdf(out, pg, `${f.fid}_0`, (x, y) => [x, H - y], W, H);
      drawMarksPdf(pg, pick(`${f.fid}_0`), (x, y) => [x, H - y], 0, W, H);
      pagesOut++;
    }
  }
  if (!pagesOut) throw new Error("이 기기에 도면 파일이 없습니다");
  const bytes = await out.save();
  const eqName = eqItem && eqItem !== "all" ? `(${(EQUIP_ITEMS.find((it) => it.key === eqItem) || {}).name || ""})` : "";
  await saveFile(`${S.proj.name}_${isEquip() ? "장비야장" + eqName : "결함야장"}.pdf`, new Blob([bytes], { type: "application/pdf" }));

  // 한글(메모·현황사진)은 PDF 기본 글꼴로 못 쓰므로 투명 그림 한 장으로 얹음
  async function drawLayerPdf(doc, pg, key, conv, W, H) {
    const ns = withNotes ? notesOn(key) : [];
    const pl = photoLabelText(key);
    if (!ns.length && !pl) return;
    const k = Math.min(3, Math.sqrt(16e6 / (W * H)));
    const c = document.createElement("canvas"); c.width = Math.round(W * k); c.height = Math.round(H * k);
    const g = c.getContext("2d"); g.scale(k, k);
    const u = unitFor(W, H);
    for (const n of ns) {
      g.strokeStyle = penColor(n); g.fillStyle = COL.note; g.lineCap = "round"; g.lineJoin = "round";
      if (n.kind === "pen") {
        g.lineWidth = penWidth(u, n); g.beginPath();
        n.pts.forEach((q, i) => (i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])));
        if (n.pts.length === 1) g.lineTo(n.pts[0][0] + 0.01, n.pts[0][1]);
        g.stroke();
      } else {
        const fs = noteFs(n, u);
        g.font = `500 ${fs}px ${NOTE_FONT}`; g.textBaseline = "alphabetic";
        noteLines(n).forEach((l, i) => {
          const y = n.at[1] + fs * (1.3 * i + 1);
          g.lineWidth = fs * 0.2; g.strokeStyle = "#fff"; g.strokeText(l, n.at[0], y);
          g.fillText(l, n.at[0], y);
        });
      }
    }
    if (pl) {
      const fs = u * 1.2, pad = fs * 0.4, h = fs * 1.6;
      g.font = `700 ${fs}px ${NOTE_FONT}`;
      const w = Math.max(textEm(pl) * fs, g.measureText(pl).width) + pad * 2;
      g.fillStyle = "#fff"; g.fillRect(u, u, w, h);
      g.lineWidth = u * 0.1; g.strokeStyle = "#16202b"; g.strokeRect(u, u, w, h);
      g.fillStyle = "#16202b"; g.textBaseline = "middle"; g.fillText(pl, u + pad, u + h / 2);
    }
    const blob = await new Promise((r) => c.toBlob(r, "image/png"));
    const img = await doc.embedPng(await blob.arrayBuffer());
    // 그림의 왼쪽 아래 = 화면 기준 (0,H), 가로축 방향으로 회전 (회전된 PDF 쪽도 맞음)
    const a = conv(0, H), b = conv(1, H);
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
    pg.drawImage(img, { x: a[0], y: a[1], width: W, height: H, rotate: degrees(ang) });
  }
  function drawMarksPdf(pg, ms, conv, rot, W, H) {
    const u = unitFor(W, H), r = u * 1.05, sw = u * 0.17;
    const P = (q) => conv(q[0], q[1]);
    for (const m of ms) {
      red = isEquip() && m.type !== "arrow" ? BLUE : RED;
      const lp = labelPos(m, u);
      if (m.type === "point") {
        const [x, y] = m.pts[0];
        const dx = lp[0] - x, dy = lp[1] - y, dd = Math.hypot(dx, dy) || 1;
        const a = P([x, y]), b = P([lp[0] - dx / dd * r, lp[1] - dy / dd * r]);
        pg.drawLine({ start: { x: a[0], y: a[1] }, end: { x: b[0], y: b[1] }, thickness: sw, color: red });
        pg.drawCircle({ x: a[0], y: a[1], size: u * 0.38, color: red });
      } else if (m.type === "arrow") {
        const [x, y] = m.pts[0];
        const dx = x - lp[0], dy = y - lp[1], dd = Math.hypot(dx, dy) || 1, ux = dx / dd, uy = dy / dd;
        const hl = u * 1.1, hw = u * 0.55, bx = x - ux * hl, by = y - uy * hl;
        const s0 = P([lp[0] + ux * r, lp[1] + uy * r]), s1 = P([bx, by]);
        pg.drawLine({ start: { x: s0[0], y: s0[1] }, end: { x: s1[0], y: s1[1] }, thickness: sw, color: red });
        const t0 = P([x, y]), t1 = P([bx - uy * hw, by + ux * hw]), t2 = P([bx + uy * hw, by - ux * hw]);
        pg.drawSvgPath(`M ${t0[0]} ${-t0[1]} L ${t1[0]} ${-t1[1]} L ${t2[0]} ${-t2[1]} Z`, { x: 0, y: 0, color: red, borderWidth: 0 });
      } else {
        const a = P(m.pts[0]), b = P(m.pts[1]);
        pg.drawRectangle({ x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), width: Math.abs(a[0] - b[0]), height: Math.abs(a[1] - b[1]), color: red, opacity: 0.12, borderColor: red, borderWidth: sw, borderOpacity: 1, borderDashArray: [u * 0.6, u * 0.35] });
      }
    }
    for (const m of ms) {
      red = isEquip() && m.type !== "arrow" ? BLUE : RED;
      const lp = labelPos(m, u);
      const c = P(lp);
      pg.drawCircle({ x: c[0], y: c[1], size: r, color: white, borderColor: red, borderWidth: sw });
      const t = String(m.no ?? "");
      const fs = u * (t.length >= 4 ? 0.62 : t.length >= 3 ? 0.8 : t.length === 2 ? 0.95 : 1.1);
      const w = font.widthOfTextAtSize(t, fs), h = fs * 0.72;
      const th = (rot || 0) * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);
      const ox = -w / 2 * cs + h / 2 * sn, oy = -w / 2 * sn - h / 2 * cs;
      pg.drawText(t, { x: c[0] + ox, y: c[1] + oy, size: fs, font, color: red, rotate: degrees(rot || 0) });
      // 장비 [전체]: 번호 원 오른쪽 아래에 항목 번호(R-3 S-2 D-1) — 엑셀·항목별 PDF와 같은 번호, 흰 바탕
      const tags = eqAllLabs ? eqAllLabs.map((mp) => mp.get(m.id)).filter(Boolean).join(" ") : "";
      if (tags) {
        const f2 = u * 0.75, tw = font.widthOfTextAtSize(tags, f2), pad = f2 * 0.2, A = P([lp[0] + r * 1.05, lp[1] + r * 1.35]);
        const at = (lx, ly) => [A[0] + lx * cs - ly * sn, A[1] + lx * sn + ly * cs];
        const o = at(-pad, -f2 * 0.28);
        pg.drawRectangle({ x: o[0], y: o[1], width: tw + 2 * pad, height: f2 * 1.05, color: white, opacity: 0.85, rotate: degrees(rot || 0) });
        pg.drawText(tags, { x: A[0], y: A[1], size: f2, font, color: red, rotate: degrees(rot || 0) });
      }
    }
  }
}

/* ---------------- 백업 파일 ---------------- */
// 백업 파일 = 조사 + 결함·메모 + 도면 파일(base64). 파일 하나로 다른 태블릿·지워진 태블릿에서도 조사 전체를 되살림 (version 3)
const blobToB64 = (b) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = rej; fr.readAsDataURL(b); });
const b64ToBlob = (s, type) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); };
async function exportJson() {
  const files = [];
  for (const f of S.proj.files) { const b = await Local.getBlob(f.fid); if (b) files.push({ fid: f.fid, mime: b.type || f.mime || "", data: await blobToB64(b) }); }
  const data = { format: "defect-yajang", version: 3, savedAt: now(), project: metaOf(S.proj), marks: S.proj.marks, notes: S.proj.notes || [], files };
  const d = new Date(); const p = (n) => String(n).padStart(2, "0");
  const ok = await saveFile(`${S.proj.name}_백업_${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`, JSON.stringify(data));
  if (ok && S.proj) { S.proj.lastBackupAt = now(); await flushLocal(); }
  return ok;
}
// 홈: 백업 파일로 조사 통째로 되살리기. 같은 조사가 이미 있으면 '(복원)' 사본으로 만듦 (기존 것은 안 건드림)
async function restoreBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast("백업 파일을 읽을 수 없습니다"); return; }
  if (!data || data.format !== "defect-yajang" || !data.project) { toast("결함 야장 백업 파일이 아닙니다"); return; }
  if (!data.files || !data.files.length) { toast("도면이 들어 있지 않은 예전 백업입니다. 같은 도면으로 새 조사를 만든 뒤 설정 → 백업 파일 불러와 합치기를 쓰세요", 7000); return; }
  for (const f of data.files) await Local.putBlob(f.fid, b64ToBlob(f.data, f.mime));
  const exists = await Local.getProject(data.project.id);
  const p = { ...data.project, marks: data.marks || [], notes: data.notes || [], trashedAt: 0, lastBackupAt: data.savedAt || 0, updatedAt: now() };
  if (exists && !exists.trashedAt) { p.id = uid(); p.name = `${p.name} (복원)`; }
  await Local.putProject(p);
  if (FEATURE_EQUIP) setHomeTab(p.kind === "equip" ? "equip" : "defect");

document.addEventListener("keydown", (e) => {
  if (S.view !== "work" || !$("#modal").hidden) { if (e.key === "Escape") closeModal(); return; }
  const typing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && !typing && (e.key.toLowerCase() === "y" || (e.shiftKey && e.key.toLowerCase() === "z"))) { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); return; }
  if (typing) return;
  if (e.key === "Escape") { S.sel = null; renderOverlay(); renderPanel(); }
  if (e.key === "ArrowRight" || e.key === "PageDown") showPage(S.cur + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") showPage(S.cur - 1);
  const map = { "1": "point", "2": "arrow", "3": "area", "4": "pen", "5": "eraser" };
  if (map[e.key]) { S.tool = map[e.key]; renderBar(); showHint(); }
});
